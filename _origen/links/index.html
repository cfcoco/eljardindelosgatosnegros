<!DOCTYPE html>
<html lang="es" class="lw-wait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Jardín de los Gatos Negros · Links</title>
<style>
  @font-face{font-family:"Gabarito";src:url("fonts/gabarito-regular.ttf") format("truetype");font-weight:400;font-display:swap}
  @font-face{font-family:"Gabarito";src:url("fonts/gabarito-medium.ttf") format("truetype");font-weight:500;font-display:swap}
  @font-face{font-family:"Gabarito";src:url("fonts/gabarito-extrabold.ttf") format("truetype");font-weight:800;font-display:swap}
  @font-face{font-family:"Trazo";src:url("fonts/trazo.ttf") format("truetype");font-display:swap}
  :root{--crema:#F1F0EB;--negro:#010101;--bordo:#70293C;--rosa:#BE9BA5;--verde:#016D71}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--negro);color:var(--crema)}
  body{font-family:"Gabarito",system-ui,sans-serif;font-weight:400;min-height:100vh;-webkit-font-smoothing:antialiased}
  .cab{background:var(--crema);padding:34px 16px 34px;display:flex;flex-direction:column;align-items:center}
  main{width:100%;max-width:440px;margin:0 auto;padding:28px 16px 0;display:flex;flex-direction:column;align-items:center}

  /* Cabecera */
  .eyebrow{font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--bordo);text-align:center;line-height:1.6}
  .mark{width:min(64vw,250px);margin-top:22px;cursor:pointer}
  .mark .cat{width:100%;display:block;opacity:0;transition:opacity .7s ease}
  .mark .cat.ve{opacity:1}
  .mark svg.name{width:100%;display:block;height:auto;margin-top:10%;overflow:visible}
  .lw-wait .mark svg.name{visibility:hidden}
  .fit{white-space:nowrap;width:100%}
  .eyebrow.fit{text-align:center}
  .bienvenida{font-family:"Trazo",serif;color:var(--bordo);font-size:34px;line-height:1.1;text-align:center;margin-top:28px}

  /* Bloques de color (próximo encuentro y links) */
  .bloques{width:100%;display:grid;gap:10px}
  .bloque{border-radius:6px;color:var(--crema)}
  .bordo{background:var(--bordo);color:var(--crema)}

  .encuentro{padding:28px 22px 26px}
  .encuentro .serie{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .encuentro .serie .tz{font-family:"Trazo",serif;color:var(--rosa);font-size:clamp(24px,7.4vw,32px);line-height:1}
  .encuentro .serie .n{font-family:"Trazo",serif;font-size:clamp(24px,7.4vw,32px);line-height:1;color:var(--rosa)}
  .encuentro h2{font-weight:800;font-size:28px;line-height:1.08;margin-top:14px}
  .encuentro .autor{font-size:16px;margin-top:4px}
  .datos{list-style:none;margin-top:16px;display:grid;gap:6px;font-size:15px}
  .datos b{font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;display:inline-block;width:76px;opacity:.8}
  .reserva{display:inline-flex;align-items:center;gap:12px;margin-top:22px;background:var(--crema);color:var(--bordo);
           text-decoration:none;font-weight:500;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
           padding:16px 26px 16px 20px;border-radius:2px 999px 999px 2px;transition:transform .18s ease}
  .reserva svg{width:20px;height:20px}
  .reserva:hover{transform:translateX(4px)}

  a.link{display:flex;align-items:center;gap:16px;padding:22px 22px;text-decoration:none;transition:transform .18s ease}
  a.link .ico{width:30px;height:30px;flex:none;color:var(--rosa)}
  a.link .txt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
  a.link .t{font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
  a.link .s{font-size:14px;opacity:.85}
  a.link .fl{width:22px;height:22px;flex:none;transition:transform .18s ease}
  a.link:hover .fl{transform:translateX(5px)}
  a:focus-visible{outline:3px solid var(--verde);outline-offset:3px}

  footer{width:100%;background:var(--crema);color:var(--negro);text-align:center;padding:34px 22px 30px;margin-top:40px}
  .pie{width:100%;max-width:440px;margin:0 auto}
  .chau{display:flex;align-items:flex-end;justify-content:center;gap:4px}
  .chau p{font-family:"Trazo",serif;font-size:32px;line-height:1.05;color:var(--bordo);text-align:right;padding-bottom:14px}
  .chau img{width:132px;height:auto;flex:none;margin-right:-6px}
  .credit{margin-top:26px;text-align:left;font-size:13px;line-height:1.6;color:var(--negro)}
  .credit .por{font-family:"Trazo",serif;font-size:19px;color:var(--negro);line-height:1}

  /* Entrada suave */
  .sube{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
  .sube.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.sube{opacity:1;transform:none;transition:none}.reserva:hover,a.link:hover .fl{transform:none}}
</style>
</head>

    el.style.display = "inline-block"; el.style.width = "auto";
    const real = el.scrollWidth; el.style.display = ""; el.style.width = "";
    if (real > ancho) {
      const k = ancho / real; el.style.fontSize = (base * k * 0.99) + "px";
      el.querySelectorAll(".por").forEach(p => { const pb = parseFloat(getComputedStyle(p).fontSize); p.style.fontSize = (pb * k * 0.99) + "px"; });
    }
  });
}
addEventListener("resize", ajustar);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar); else ajustar();
addEventListener("load", ajustar); if (document.fonts) document.fonts.addEventListener("loadingdone", ajustar);
[300, 1000, 2500].forEach(t => setTimeout(ajustar, t));

const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let restoMostrado = false;
function mostrarResto(rapido){
  if (restoMostrado) return; restoMostrado = true;
  document.querySelectorAll(".sube").forEach(el => setTimeout(() => el.classList.add("in"), rapido ? 0 : (+el.dataset.d || 0)));
}

/* Logotipo: se escribe letra por letra, como a mano (igual que en el dossier).
   El gato parpadea al empezar, se queda quieto mientras se escribe y parpadea lento al terminar.
   Arranca recién cuando la página está a la vista, se repite al volver a la página y al tocar el logo. */
const svg = document.querySelector(".mark svg.name"), cat = document.querySelector(".mark .cat");
const NS = "http://www.w3.org/2000/svg";
let rects = null, corrida = 0;
function prepararMascaras(){
  const defs = document.createElementNS(NS, "defs"); svg.insertBefore(defs, svg.firstChild); rects = [];
  [...svg.querySelectorAll("path")].forEach((p, k) => {
    const bb = p.getBBox(), pad = bb.height * .25, m = document.createElementNS(NS, "mask"), r = document.createElementNS(NS, "rect");
    m.setAttribute("id", "lw" + k); m.setAttribute("maskUnits", "userSpaceOnUse");
    [["x", bb.x - pad], ["y", bb.y - pad], ["width", bb.width + 2 * pad], ["height", bb.height + 2 * pad]].forEach(([a, v]) => m.setAttribute(a, v));
    r.setAttribute("x", bb.x - pad); r.setAttribute("y", bb.y - pad); r.setAttribute("height", bb.height + 2 * pad);
    r.setAttribute("width", 0); r.setAttribute("fill", "#fff");
    m.appendChild(r); defs.appendChild(m); p.setAttribute("mask", "url(#lw" + k + ")");
    const sw = p.getBoundingClientRect().width || 20;
    rects.push({ r, w: bb.width + 2 * pad, dur: 90 + sw * 2.4 });
  });
  const gapAfter = { 1: 70, 7: 70, 9: 70, 12: 170, 17: 70 };   // pausas entre palabras y al cambiar de renglón
  let t = 0; rects.forEach((o, k) => { o.start = t; t += o.dur * .55 + (gapAfter[k] || 0); });
}
function escribir(){
  document.documentElement.classList.remove("lw-wait");
  if (reduce) { cat.classList.add("ve"); cat.src = "img/isologo-anim.webp"; mostrarResto(true); return; }
  if (!rects) { try { prepararMascaras(); } catch (e) { cat.classList.add("ve"); mostrarResto(true); return; } }
  const run = ++corrida;
  rects.forEach(o => o.r.setAttribute("width", 0));
  let t0 = null, cambio = false;
  function frame(ts){
    if (run !== corrida) return;
    if (t0 === null) t0 = ts; const el = ts - t0 - 1000; let done = true;
    rects.forEach(o => { let q = Math.min(1, Math.max(0, (el - o.start) / o.dur)); q = 1 - Math.pow(1 - q, 2);
      o.r.setAttribute("width", o.w * q); if (q < 1) done = false; });
    if (!done) requestAnimationFrame(frame);
    else if (!cambio) { cambio = true; setTimeout(() => { if (run === corrida) cat.src = "img/isologo-anim.webp"; }, 1400); }
  }
  let empezo = false;
  function go(){ if (empezo || run !== corrida) return; empezo = true; cat.classList.add("ve"); requestAnimationFrame(frame); mostrarResto(false); }
  cat.onload = go; cat.onerror = go; cat.src = "img/isologo-intro.webp?r=" + run; setTimeout(go, 900);
}
function cuandoSeVea(){
  if (document.visibilityState === "visible") escribir();
  else document.addEventListener("visibilitychange", function v(){ if (document.visibilityState === "visible") { document.removeEventListener("visibilitychange", v); escribir(); } });
}
document.querySelector(".mark").addEventListener("click", escribir);
/* Si la cabecera sale de la pantalla y vuelve a entrar, se escribe otra vez */
if ("IntersectionObserver" in window) {
  let afuera = false;
  new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) afuera = true; else if (afuera) { afuera = false; escribir(); }
  })).observe(document.querySelector(".mark"));
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(cuandoSeVea); else cuandoSeVea();
</script>
